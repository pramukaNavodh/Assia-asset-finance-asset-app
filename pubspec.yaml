name: aafassets
description: "The asset management application created for the Asia Asset Finance PLC. Author - Pramuka Navodh"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5


dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  firebase_storage: ^12.3.2
  pdf: ^3.11.1
  printing: ^5.13.2
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
    android: true
    ios: false
    image_path: "assets/icons/main_logo.png"
    adaptive_icon_background: "#FFFFFF"
    adaptive_icon_foreground: "assets/icons/main_logo.png"

flutter:
  uses-material-design: true

  assets:
     - assets/images/
     - assets/icons/

  